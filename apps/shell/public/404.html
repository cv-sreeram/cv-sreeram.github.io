<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sreeram CV | Micro-Frontend Portfolio</title>
    <script>
      // Single-SPA / GitHub Pages SPA redirect trick.
      // When GitHub Pages serves a 404 for a deep link, this page
      // encodes the path into a query string and redirects to the root,
      // where index.html picks it up and restores the original URL.
      var segmentCount = 0; // 0 for *.github.io root repos, 1 for /repo-name/ project pages
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
